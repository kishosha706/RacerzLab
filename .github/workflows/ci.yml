name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,parquet,dev]"

      - name: Validate setup knowledge data
        run: python -c "from racelab_engine.knowledge.setup.loader import load_setup_knowledge; load_setup_knowledge()"

      - name: Run backend tests
        run: python -B -m pytest -m "not slow and not integration" -q --durations=25

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Build UI
        working-directory: ui
        run: npm run build
