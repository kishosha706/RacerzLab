name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RACELAB_DB_PATH: ${{ github.workspace }}/.racelab-ci-fast-${{ github.run_id }}.sqlite3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate setup knowledge data
        run: python -c "from racelab_engine.knowledge.setup.loader import load_setup_knowledge; load_setup_knowledge()"

      - name: Lint Python
        run: python -m ruff check .

      - name: Run backend tests
        run: python -B -m pytest -m "not slow and not integration" -q --durations=25

      - name: Run nonempty integration slice
        run: >-
          python -B -m pytest -q
          tests/test_crew_chief_contracts.py::test_event_store_survives_restart_and_rejects_tampering
          tests/test_crew_chief_contracts.py::test_terminal_event_and_learning_experience_roll_back_together
          tests/test_p321_controlled_performance_memory.py::test_restart_preserves_exact_origin_phase_effect_and_downstream_carry

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Audit UI dependency advisories
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit

      - name: Verify generated API types are current
        run: npm run check:api-contract

      - name: Run UI behavior and trust tests
        working-directory: ui
        run: npm test -- --run

      - name: Install Chromium for first-use workflow tests
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run first-use workflow tests
        working-directory: ui
        run: npm run test:e2e

      - name: Build UI
        working-directory: ui
        run: npm run build

  trust-gate:
    name: Permanent synthetic trust gate
    runs-on: ubuntu-latest
    env:
      RACELAB_DB_PATH: ${{ github.workspace }}/.racelab-ci-trust-${{ github.run_id }}.sqlite3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run permanent synthetic trust audit
        run: python scripts/audit_release_trust.py --synthetic-only

  desktop-check:
    name: Tauri desktop contract
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create compile-time sidecar resource placeholder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ui/src-tauri/bin | Out-Null
          New-Item -ItemType File -Force -Path ui/src-tauri/bin/racerzlab-backend.exe | Out-Null

      - name: Compile the desktop shell
        run: cargo check --manifest-path ui/src-tauri/Cargo.toml --locked

  full-python-main:
    name: Full Python gate on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, trust-gate, desktop-check]
    runs-on: ubuntu-latest
    env:
      RACELAB_DB_PATH: ${{ github.workspace }}/.racelab-ci-full-${{ github.run_id }}.sqlite3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run complete Python suite
        run: python -B -m pytest -q --durations=25
