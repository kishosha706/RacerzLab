name: Release Trust Gate

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ibt_path:
        description: Absolute path to the protected real .ibt fixture on the self-hosted runner
        required: true
        type: string

jobs:
  real-ibt-trust-gate:
    name: Real .ibt release trust gate
    runs-on: [self-hosted, Windows]
    env:
      RACELAB_DB_PATH: ${{ github.workspace }}\racelab-release-trust-${{ github.run_id }}.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run non-skipping real-file release audit
        shell: powershell
        env:
          IBT_PATH: ${{ inputs.ibt_path || vars.RACERZLAB_RELEASE_IBT_PATH }}
          IBT_SHA256: ${{ vars.RACERZLAB_RELEASE_IBT_SHA256 }}
          IBT_SCHEMA: ${{ vars.RACERZLAB_RELEASE_IBT_SCHEMA_FINGERPRINT }}
          IBT_RECORDS: ${{ vars.RACERZLAB_RELEASE_IBT_RECORDS }}
          IBT_CHANNELS: ${{ vars.RACERZLAB_RELEASE_IBT_DECLARED_CHANNELS }}
        run: >-
          python scripts/audit_release_trust.py
          --ibt "$env:IBT_PATH"
          --expected-sha256 "$env:IBT_SHA256"
          --expected-schema-fingerprint "$env:IBT_SCHEMA"
          --expected-records "$env:IBT_RECORDS"
          --expected-declared-channels "$env:IBT_CHANNELS"
          --require-attribution-blocked

      - name: Enforce frame-native import performance contracts
        shell: powershell
        env:
          IBT_PATH: ${{ inputs.ibt_path || vars.RACERZLAB_RELEASE_IBT_PATH }}
        run: python scripts/audit_import_pipeline_contracts.py --fixture "$env:IBT_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Audit UI dependency advisories
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the trusted Windows desktop artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "racerzlab-[platform]-[arch]-[bundle]"

      - name: Smoke packaged desktop storage, restart, ownership, and shutdown
        shell: powershell
        run: scripts/smoke_packaged_desktop.ps1 -MissingArtifactAction Fail
