[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racelab-garage"
version = "0.1.0"
description = "Local-first iRacing telemetry and setup-analysis foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.10.3",
  "PyYAML==6.0.3",
  "aiofiles==25.1.0",
]

[project.optional-dependencies]
api = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.29",
  "aiofiles==25.1.0",
]
parquet = [
  "polars==1.41.1",
]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "ruff==0.15.20",
  "pip-tools==7.6.0",
]
build = [
  "pyinstaller==6.21.0",
]
all = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "polars==1.41.1",
]

[project.scripts]
racelab = "racelab_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["racelab_engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --ignore=tests_archived"
markers = [
    "unit: Fast pure-logic or mock-based tests (no .ibt import)",
    "slow: Tests that import real .ibt files or hit full telemetry pipeline",
    "integration: Tests that cross application or persistence boundaries",
]
