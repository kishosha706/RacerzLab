[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racelab-garage"
version = "0.1.0"
description = "Local-first iRacing telemetry and setup-analysis foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "aiofiles>=24.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.6",
  "aiofiles>=24.0",
]
parquet = [
  "polars>=0.20",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
]
build = [
  "pyinstaller",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "polars>=0.20",
]

[project.scripts]
racelab = "racelab_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["racelab_engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --ignore=tests_archived"
markers = [
    "unit: Fast pure-logic or mock-based tests (no .ibt import)",
    "slow: Tests that import real .ibt files or hit full telemetry pipeline",
    "integration: Tests that cross application or persistence boundaries",
]
