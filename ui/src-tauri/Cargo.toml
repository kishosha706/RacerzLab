[package]
name = "racelab-garage"
version = "0.1.0"
description = "RacerZLab desktop shell"
edition = "2021"

[lib]
name = "racelab_garage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
